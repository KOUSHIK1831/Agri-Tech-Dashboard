image: node:20

stages:
  - install
  - lint
  - test
  - build

cache:
  paths:
    - .npm/
    - node_modules/

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

# All jobs now run on every branch to ensure you see them in every pipeline
install_deps:
  stage: install
  script:
    - npm ci

lint_code:
  stage: lint
  script:
    - npm run lint

unit_tests:
  stage: test
  script:
    - npx vitest run

build_app:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
